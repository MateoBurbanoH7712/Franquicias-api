
services:

  postgres:
    image: postgres:16
    container_name: franquicias-postgres

    environment:
      POSTGRES_DB: franquicias_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d franquicias_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: franquicias-api

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/franquicias_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
